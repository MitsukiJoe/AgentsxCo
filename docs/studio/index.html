<style>
:root {
  --font-sans: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-full: 999px;
  --dur-1: 120ms; --dur-2: 180ms; --dur-3: 240ms; --dur-4: 360ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.3, 1.4, .6, 1);
  --sb-w: 296px; --insp-w: 360px;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg-0: #0A0C10; --bg-1: #0F1217; --bg-2: #151920; --bg-3: #1B2029;
  --glass: rgba(16, 19, 25, .72); --glass-strong: rgba(21, 25, 32, .86);
  --line: rgba(255, 255, 255, .07); --line-strong: rgba(255, 255, 255, .13);
  --text-1: #ECEEF2; --text-2: #A6ADBB; --text-3: #6E7685;
  --accent: #7EA4FF; --accent-fill: #3366E8; --accent-soft: rgba(91, 140, 255, .14);
  --gold: #E9B949; --ok: #3DD39A; --warn: #F4B04A; --danger: #F26B76; --violet: #A88BFF;
  --tint-accent: rgba(91, 140, 255, .08); --edge-accent: rgba(126, 164, 255, .30);
  --tint-gold: rgba(233, 185, 73, .07); --edge-gold: rgba(233, 185, 73, .30);
  --tint-ok: rgba(61, 211, 154, .08); --edge-ok: rgba(61, 211, 154, .28);
  --tint-warn: rgba(244, 176, 74, .08); --edge-warn: rgba(244, 176, 74, .30);
  --tint-danger: rgba(242, 107, 118, .09); --edge-danger: rgba(242, 107, 118, .30);
  --tint-violet: rgba(168, 139, 255, .09); --edge-violet: rgba(168, 139, 255, .30);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .24);
  --shadow-md: inset 0 1px 0 rgba(255, 255, 255, .04), 0 8px 24px -8px rgba(0, 0, 0, .5);
  --shadow-lg: inset 0 1px 0 rgba(255, 255, 255, .05), 0 24px 64px -16px rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .5);
  --av-l: 60%; --av-l2: 46%;
  --glow: rgba(51, 102, 232, .16);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg-0: #F3F4F6; --bg-1: #FAFAFB; --bg-2: #FFFFFF; --bg-3: #F1F3F6;
  --glass: rgba(255, 255, 255, .72); --glass-strong: rgba(255, 255, 255, .9);
  --line: rgba(15, 23, 42, .08); --line-strong: rgba(15, 23, 42, .14);
  --text-1: #0E1116; --text-2: #495263; --text-3: #7D8696;
  --accent: #2A5BD7; --accent-fill: #2A62F0; --accent-soft: rgba(42, 98, 240, .09);
  --gold: #A87A12; --ok: #11845B; --warn: #A3620A; --danger: #C2333F; --violet: #6A48D7;
  --tint-accent: rgba(42, 98, 240, .05); --edge-accent: rgba(42, 98, 240, .24);
  --tint-gold: rgba(196, 146, 28, .07); --edge-gold: rgba(168, 122, 18, .28);
  --tint-ok: rgba(17, 132, 91, .06); --edge-ok: rgba(17, 132, 91, .24);
  --tint-warn: rgba(196, 120, 12, .07); --edge-warn: rgba(163, 98, 10, .26);
  --tint-danger: rgba(194, 51, 63, .06); --edge-danger: rgba(194, 51, 63, .24);
  --tint-violet: rgba(106, 72, 215, .06); --edge-violet: rgba(106, 72, 215, .24);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-md: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px -10px rgba(15, 23, 42, .14);
  --shadow-lg: 0 2px 6px rgba(15, 23, 42, .05), 0 28px 64px -20px rgba(15, 23, 42, .22);
  --scrim: rgba(15, 23, 42, .28);
  --av-l: 70%; --av-l2: 58%;
  --glow: rgba(42, 98, 240, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: 14px/1.6 var(--font-sans); color: var(--text-1); background: var(--bg-1);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden;
  font-feature-settings: "cv11", "ss01";
}
html.theme-switching *, html.theme-switching *::before, html.theme-switching *::after {
  transition: background-color var(--dur-3) var(--ease-out), color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out), fill var(--dur-3) !important;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }
.ic { flex: none; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }

/* ---------- App shell ---------- */
.app {
  display: grid; height: 100dvh; background: var(--bg-1);
  grid-template-columns: var(--sb-w) minmax(0, 1fr) 0px;
  transition: grid-template-columns var(--dur-4) var(--ease-out);
}
.app.insp-open { grid-template-columns: var(--sb-w) minmax(0, 1fr) calc(var(--insp-w) + 8px); }

/* ---------- Sidebar ---------- */
.sidebar { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg-1); }
.sb-top { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none;
  background: linear-gradient(140deg, #4C7DFF, #2747C9); color: #fff; font-weight: 750; font-size: 11.5px; letter-spacing: -.02em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 4px 14px -4px rgba(51, 102, 232, .6);
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-txt b { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand-txt span { font-size: 11.5px; color: var(--text-3); }
.brand .ws { margin-left: auto; }
.search { position: relative; }
.search input {
  width: 100%; height: 34px; border-radius: var(--r-sm); background: var(--bg-2); border: 1px solid var(--line);
  padding: 0 44px 0 32px; font-size: 13px; outline: none; transition: border-color var(--dur-1), box-shadow var(--dur-1);
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--edge-accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search .ic { position: absolute; left: 10px; top: 9px; color: var(--text-3); }
.search kbd { position: absolute; right: 8px; top: 7px; }
kbd {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); background: var(--bg-3);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; line-height: 16px;
}
.sb-scroll { flex: 1; overflow-y: auto; padding: 2px 10px 12px; min-height: 0; }

.pinned {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--r-md); text-align: left;
  background: var(--tint-gold); border: 1px solid var(--edge-gold); margin-bottom: 6px;
  transition: background var(--dur-1), box-shadow var(--dur-2), transform var(--dur-1);
}
.pinned:hover { box-shadow: var(--shadow-md); }
.pinned:active { transform: scale(.99); }
.pinned.active { box-shadow: 0 0 0 3px var(--tint-gold), var(--shadow-md); }
.pinned .sb-name { font-weight: 650; }
.pinned .priv { font-family: var(--font-mono); font-size: 10.5px; color: var(--gold); }
.sec-head {
  display: flex; align-items: center; gap: 6px; padding: 16px 8px 6px; font-size: 11px; font-weight: 650;
  letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); user-select: none;
}
.sec-head .cnt { font-family: var(--font-mono); letter-spacing: 0; font-weight: 500; }
.sec-head .act { margin-left: auto; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--text-3); }
.sec-head .act:hover { background: var(--bg-3); color: var(--text-1); }

.sb-row {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md);
  text-align: left; border: 1px solid transparent; position: relative;
  transition: background var(--dur-1), border-color var(--dur-1);
}
.sb-row:hover { background: var(--bg-3); }
.sb-row.active { background: var(--accent-soft); border-color: var(--edge-accent); }
.sb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sb-topline { display: flex; align-items: baseline; gap: 8px; }
.sb-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-topline time { margin-left: auto; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
.sb-sub { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub b { font-weight: 550; color: var(--text-1); }
.unread {
  flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-fill); color: #fff;
  font-size: 10.5px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.unread.dot { min-width: 8px; width: 8px; height: 8px; padding: 0; }
.stack { display: flex; flex: none; align-items: center; }
.stack > * + * { margin-left: -9px; }
.stack .av { box-shadow: 0 0 0 2px var(--bg-1); }
.stack .more {
  height: 22px; min-width: 26px; padding: 0 5px; border-radius: 11px; background: var(--bg-3); border: 1px solid var(--line-strong);
  font-size: 10.5px; font-weight: 650; color: var(--text-2); display: grid; place-items: center; position: relative; z-index: 1;
  box-shadow: 0 0 0 2px var(--bg-1); font-variant-numeric: tabular-nums;
}
.dept-head {
  width: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); font-weight: 600;
}
.dept-head:hover { background: var(--bg-3); color: var(--text-1); }
.dept-head .chev { transition: transform var(--dur-2) var(--ease-out); color: var(--text-3); }
.dept-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.dept-head .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.dept-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-3) var(--ease-out); }
.dept-body.closed { grid-template-rows: 0fr; }
.dept-body > div { overflow: hidden; }
.emp { padding: 6px 10px 6px 14px; gap: 9px; }
.emp .sb-name { font-weight: 500; font-size: 13px; }
.emp .en { font-size: 11px; color: var(--text-3); }
.st-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-left: auto; }
.st-dot.online { background: var(--ok); box-shadow: 0 0 0 3px var(--tint-ok); }
.st-dot.busy { background: var(--warn); box-shadow: 0 0 0 3px var(--tint-warn); }
.st-dot.readonly { background: transparent; border: 1.5px solid var(--text-3); }
.empty-search { padding: 18px 12px; text-align: center; color: var(--text-3); font-size: 12.5px; }

.tour { margin: 6px 4px 0; padding: 10px; border-radius: var(--r-md); background: var(--bg-2); border: 1px solid var(--line); }
.tour .ov { margin-bottom: 8px; }
.tour-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tour-btns button {
  padding: 6px 4px; border-radius: 8px; font-size: 11.5px; color: var(--text-2); background: var(--bg-3); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; line-height: 1.3; transition: all var(--dur-1);
}
.tour-btns button b { font-size: 13px; color: var(--text-1); }
.tour-btns button:hover, .tour-btns button.on { border-color: var(--edge-accent); background: var(--accent-soft); color: var(--text-1); }
.sb-foot { padding: 10px 12px 12px; display: flex; align-items: center; gap: 10px; }
.me-av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-3); border: 1px solid var(--line-strong); font-size: 15px; }
.sb-foot .who-me { flex: 1; min-width: 0; line-height: 1.25; }
.sb-foot .who-me b { font-size: 13px; font-weight: 600; display: block; }
.sb-foot .who-me span { font-size: 11.5px; color: var(--text-3); }

.icon-btn {
  width: 32px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2);
  transition: background var(--dur-1), color var(--dur-1), transform var(--dur-1); flex: none;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text-1); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }

/* ---------- Avatars ---------- */
.av {
  --s: 32px; width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; flex: none; position: relative;
  font-size: calc(var(--s) * .5); line-height: 1;
  background: linear-gradient(135deg, hsl(var(--h) 72% var(--av-l)), hsl(calc(var(--h) + 28) 68% var(--av-l2)));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
}
.av .star {
  position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--gold); color: #fff;
  font-size: 9px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg-1); line-height: 1;
}
html[data-theme="dark"] .av .star { color: #1d1606; }

/* ---------- Main ---------- */
.main {
  position: relative; min-width: 0; margin: 8px 8px 8px 0; border-radius: var(--r-lg); overflow: hidden;
  background: var(--bg-0); border: 1px solid var(--line); box-shadow: var(--shadow-md);
}
.main::before {
  content: ""; position: absolute; inset: -20% 10% auto; height: 420px; pointer-events: none;
  background: radial-gradient(closest-side, var(--glow), transparent); opacity: .9; z-index: 0;
}
.m-head {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 18px;
  background: var(--glass); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: 0 1px 0 var(--line);
}
.m-head .h-title { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.m-head .h-title b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.m-head .h-title span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-head .h-acts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.m-head .menu-btn { display: none; }
.stream { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 1; scroll-behavior: smooth; }
.stream.instant { scroll-behavior: auto; }
.stream-inner { max-width: 840px; margin: 0 auto; padding: 84px 24px 168px; }
.stream.org .stream-inner { max-width: 1120px; padding-bottom: 48px; }

/* rows */
.row { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; }
.row.cont { margin-top: 5px; }
.row.me { justify-content: flex-end; }
.anim .row, .anim .sys, .anim .unread-div { animation: rise var(--dur-4) var(--ease-out) both; animation-delay: calc(var(--k, 0) * 18ms); }
.row.fresh { animation: rise var(--dur-4) var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.av-sp { width: 32px; flex: none; }
.col { min-width: 0; max-width: min(640px, 88%); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.row.me .col { align-items: flex-end; }
.who { display: flex; align-items: baseline; gap: 8px; padding-left: 2px; font-size: 12.5px; }
.who button { font-weight: 650; }
.who button:hover { color: var(--accent); }
.who .role, .who time { font-size: 11.5px; color: var(--text-3); }
.who .tag { font-size: 10.5px; padding: 0 6px; border-radius: 5px; background: var(--tint-gold); color: var(--gold); border: 1px solid var(--edge-gold); font-weight: 600; }
.bubble {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px 16px 16px 16px; padding: 9px 13px;
  line-height: 1.68; word-break: break-word; box-shadow: var(--shadow-sm); max-width: 100%;
}
.row.cont .bubble { border-radius: 16px; }
.row.me .bubble { background: var(--accent-fill); color: #fff; border-color: transparent; border-radius: 16px 16px 6px 16px; }
.row.me.cont .bubble { border-radius: 16px; }
.bubble.hl { background: linear-gradient(var(--tint-accent), var(--tint-accent)), var(--bg-2); border-color: var(--edge-accent); }
.bubble code { background: var(--bg-3); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
.row.me .bubble code { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .2); }
.bubble strong { font-weight: 650; }
.mention { color: var(--accent); background: var(--accent-soft); padding: 0 4px; border-radius: 5px; font-weight: 550; cursor: pointer; }
.row.me .mention { color: #fff; background: rgba(255, 255, 255, .2); }
.sec { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.row.me .sec { color: #fff; }
.b-meta { display: inline-flex; align-items: center; gap: 4px; float: right; margin: 6px -4px -4px 12px; font-size: 11px; opacity: .78; font-variant-numeric: tabular-nums; }
.tick { display: inline-grid; place-items: center; width: 18px; height: 16px; border-radius: 8px; }
.tick svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tick.read { background: rgba(255, 255, 255, .26); }
.tick .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sys { display: flex; justify-content: center; margin: 18px 0 6px; }
.sys span { font-size: 11.5px; color: var(--text-3); background: var(--bg-2); border: 1px solid var(--line); padding: 3px 11px; border-radius: 999px; text-align: center; }
.unread-div { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; color: var(--accent); font-size: 11.5px; font-weight: 600; }
.unread-div::before, .unread-div::after { content: ""; flex: 1; height: 1px; background: var(--edge-accent); }
.typing-b { display: inline-flex; gap: 4px; padding: 13px 14px; }
.typing-b i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: breathe 1.2s infinite ease-in-out; }
.typing-b i:nth-child(2) { animation-delay: .15s; } .typing-b i:nth-child(3) { animation-delay: .3s; }
@keyframes breathe { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

/* files */
.files { display: flex; flex-wrap: wrap; gap: 8px; }
.file {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: var(--r-md); background: var(--bg-2);
  border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; transition: border-color var(--dur-1), transform var(--dur-1);
}
.file:hover { border-color: var(--edge-accent); }
.file:active { transform: scale(.98); }
.file .f-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--tint-accent); color: var(--accent); border: 1px solid var(--edge-accent); }
.file b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; display: block; }
.file span { font-size: 11.5px; color: var(--text-3); }

/* ---------- Cards ---------- */
.card {
  --c: var(--accent); --ct: var(--tint-accent); --ce: var(--edge-accent);
  width: min(620px, 100%); background: var(--bg-2); border: 1px solid var(--ce); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-md);
}
.v-ok { --c: var(--ok); --ct: var(--tint-ok); --ce: var(--edge-ok); }
.v-warn { --c: var(--warn); --ct: var(--tint-warn); --ce: var(--edge-warn); }
.v-danger { --c: var(--danger); --ct: var(--tint-danger); --ce: var(--edge-danger); }
.v-violet { --c: var(--violet); --ct: var(--tint-violet); --ce: var(--edge-violet); }
.v-gold { --c: var(--gold); --ct: var(--tint-gold); --ce: var(--edge-gold); }
.v-neutral { --c: var(--text-2); --ct: var(--bg-3); --ce: var(--line-strong); }
.c-head { display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: var(--ct); box-shadow: 0 1px 0 var(--line); }
.c-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--c); background: var(--bg-2); border: 1px solid var(--ce); }
.c-title { font-weight: 650; font-size: 14px; letter-spacing: -.005em; line-height: 1.3; }
.c-sub { font-size: 12px; color: var(--text-3); line-height: 1.35; margin-top: 2px; }
.c-head .chip { margin-left: auto; }
.c-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.c-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; box-shadow: 0 -1px 0 var(--line); flex-wrap: wrap; }
.c-foot .note { font-size: 12px; color: var(--text-3); margin-right: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650;
  background: var(--ct); color: var(--c); border: 1px solid var(--ce); white-space: nowrap; flex: none;
  --c: var(--accent); --ct: var(--tint-accent); --ce: var(--edge-accent);
}
.chip.mono { font-family: var(--font-mono); font-weight: 600; font-size: 11px; }
.chip .ic { width: 12px; height: 12px; }
.ov { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }

.btn {
  height: 32px; padding: 0 12px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600;
  background: var(--bg-2); border: 1px solid var(--line-strong); color: var(--text-1); white-space: nowrap;
  transition: background var(--dur-1), border-color var(--dur-1), transform var(--dur-1), opacity var(--dur-2), box-shadow var(--dur-1);
}
.btn:hover { background: var(--bg-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent-fill); color: #fff; border-color: transparent; box-shadow: 0 6px 16px -8px rgba(51, 102, 232, .8); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-3); color: var(--text-1); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* options */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); text-align: left; width: 100%;
  background: var(--bg-2); border: 1px solid var(--line-strong); transition: border-color var(--dur-1), background var(--dur-1), opacity var(--dur-3), transform var(--dur-1);
}
.opt:hover { border-color: var(--edge-accent); background: var(--tint-accent); }
.opt:active { transform: scale(.99); }
.opt .o-key {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 12.5px;
  background: var(--bg-3); border: 1px solid var(--line-strong); font-family: var(--font-mono);
}
.opt .o-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4; }
.opt .o-txt b { font-weight: 600; font-size: 13.5px; }
.opt .o-txt small { font-size: 12px; color: var(--text-3); }
.opt .o-check { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; opacity: 0; transform: scale(.4); transition: all var(--dur-3) var(--ease-spring); background: var(--accent-fill); color: #fff; }
.opt.sel { border-color: var(--edge-accent); background: var(--accent-soft); }
.opt.sel .o-key { background: var(--accent-fill); color: #fff; border-color: transparent; }
.opt.sel .o-check { opacity: 1; transform: none; }
.opts.decided .opt:not(.sel) { opacity: .45; }
.opts.decided .opt { cursor: default; }
.opts.decided .opt:not(.sel):hover { border-color: var(--line-strong); background: var(--bg-2); }

/* stage gate */
.gate-steps { padding: 6px 14px 12px; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; position: relative; }
.step + .step::before { content: ""; position: absolute; left: 14.5px; top: -14px; height: 24px; width: 1px; background: var(--line-strong); }
.st-idx { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; font-family: var(--font-mono); border: 1px solid var(--ce); background: var(--ct); color: var(--c); transition: all var(--dur-3); }
.st-idx .ic { width: 15px; height: 15px; }
.st-title { display: flex; align-items: center; gap: 8px; font-weight: 650; flex-wrap: wrap; }
.st-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.st-meta { font-size: 11.5px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--bg-3); margin-top: 9px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 70%, #fff)); transition: width 900ms var(--ease-out); }
.held-quote { margin-top: 8px; font-size: 12.5px; color: var(--text-2); padding: 9px 11px; border-radius: 10px; background: var(--bg-3); border: 1px dashed var(--edge-warn); }
.linkish { color: var(--accent); font-size: 12px; font-weight: 550; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
.linkish:hover { text-decoration: underline; }
.unlock-anim .st-idx { animation: pop 500ms var(--ease-spring); }
@keyframes pop { 0% { transform: scale(.6) rotate(-20deg); } 100% { transform: none; } }

/* report */
.funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.funnel div { padding: 8px 10px; border-radius: 10px; background: var(--bg-3); border: 1px solid var(--line); }
.funnel b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.funnel span { font-size: 11.5px; color: var(--text-3); }
.funnel div:last-child { background: var(--ct); border-color: var(--ce); }
.funnel div:last-child b { color: var(--c); }
.rp-label { font-size: 12px; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
.quote { margin: 0; padding: 11px 13px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); position: relative; }
.quote p { margin: 0; font-size: 13.5px; }
.quote footer { margin-top: 6px; font-size: 11.5px; color: var(--text-3); }
.quote::before { content: "“"; position: absolute; right: 12px; top: -6px; font-size: 44px; color: var(--ce); font-family: Georgia, serif; line-height: 1; }
.rp-text { margin: 0; font-size: 13.5px; color: var(--text-1); }

/* task card */
.t-goal { font-size: 13.5px; }
.t-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.t-sec { padding: 10px 11px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); }
.t-sec h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; color: var(--text-3); font-weight: 650; text-transform: uppercase; }
.t-sec ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.t-sec li { font-size: 12.5px; line-height: 1.45; display: flex; gap: 6px; }
.t-sec li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); flex: none; margin-top: 8px; }
.t-sec code { font-size: 11.5px; }
.t-mandate { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.mentions { display: flex; gap: 6px; flex-wrap: wrap; }

/* verdict */
.verdict-tag { font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 3px 9px; border-radius: 7px; color: var(--c); background: var(--bg-2); border: 1px solid var(--ce); margin-left: auto; }
.issues { display: flex; flex-direction: column; gap: 8px; }
.issue { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 11px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); }
.issue .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--bg-2); border: 1px solid var(--line-strong); font-size: 13px; }
.issue .i-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.issue .i-top b { font-size: 13.5px; font-weight: 650; }
.issue .ref { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.issue p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-2); }
.issue p code { font-size: 11.5px; background: var(--bg-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }
.fixed .n { background: var(--tint-ok); border-color: var(--edge-ok); color: var(--ok); }
.c-note { font-size: 13px; }

/* new message pill */
.new-pill {
  position: absolute; z-index: 6; top: 72px; left: 50%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; height: 34px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line-strong);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); box-shadow: var(--shadow-lg);
  transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out); font-size: 12.5px; font-weight: 600;
}
.new-pill.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.new-pill button { height: 100%; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; color: var(--accent); }
.new-pill button.x { padding: 0 12px 0 8px; color: var(--text-3); font-size: 16px; }
.new-pill button.x:hover { color: var(--text-1); }
.new-pill .sep { width: 1px; height: 16px; background: var(--line-strong); }
.collect-banner {
  display: flex; align-items: center; gap: 10px; margin: 18px auto 0; width: min(620px, 100%); padding: 10px 12px; border-radius: 14px;
  background: var(--tint-gold); border: 1px solid var(--edge-gold); font-size: 12.5px;
}
.collect-banner .btn { margin-left: auto; }

/* composer */
.composer {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 12px 24px 14px;
  background: linear-gradient(to top, var(--bg-0) 35%, transparent);
}
.cmp-box {
  max-width: 792px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 18px;
  background: var(--glass-strong); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  transition: border-color var(--dur-2), box-shadow var(--dur-2);
}
.cmp-box:focus-within { border-color: var(--edge-accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-lg); }
.cmp-box textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; padding: 7px 4px; min-height: 34px; max-height: 160px; line-height: 1.5; font-size: 14px; }
.cmp-box textarea::placeholder { color: var(--text-3); }
.cmp-box .send { width: 34px; height: 34px; border-radius: 12px; background: var(--accent-fill); color: #fff; display: grid; place-items: center; flex: none; transition: transform var(--dur-1), opacity var(--dur-2); }
.cmp-box .send:active { transform: scale(.92); }
.cmp-box .send[disabled] { opacity: .4; }
.cmp-hint { max-width: 792px; margin: 7px auto 0; font-size: 11.5px; color: var(--text-3); display: flex; gap: 10px; justify-content: space-between; padding: 0 6px; }
.composer.hidden { display: none; }

/* ---------- Org view ---------- */
.org-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.org-head h2 { margin: 4px 0 4px; font-size: 24px; letter-spacing: -.02em; line-height: 1.2; }
.org-head p { margin: 0; color: var(--text-2); font-size: 13px; }
.org-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { padding: 14px; border-radius: var(--r-lg); background: var(--bg-2); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); }
.blk { margin-top: 14px; padding: 18px; border-radius: var(--r-xl); background: var(--bg-2); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.blk-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.blk-head h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.blk-head p { margin: 0; font-size: 12.5px; color: var(--text-3); }
.blk-head .probe { flex: 1 0 100%; margin-left: 0; font-size: 12px; line-height: 18px; color: var(--text-2); font-family: var(--font-mono); height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree { display: flex; flex-direction: column; align-items: center; }
.t-v { width: 1px; height: 22px; background: var(--line-strong); }
.t-node {
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; background: var(--bg-3); border: 1px solid var(--line-strong);
  transition: opacity var(--dur-2), background var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); text-align: left;
}
.t-node b { font-size: 13.5px; font-weight: 650; display: block; line-height: 1.25; }
.t-node small { font-size: 11.5px; color: var(--text-3); display: block; line-height: 1.3; }
.t-node.human { padding-left: 14px; }
.t-node.sec { background: var(--tint-gold); border-color: var(--edge-gold); }
.t-groups { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; width: 100%; position: relative; padding-top: 22px; }
.t-groups::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 1px; background: var(--line-strong); }
.t-col { position: relative; min-width: 0; }
.t-col::before { content: ""; position: absolute; top: -22px; left: 50%; width: 1px; height: 22px; background: var(--line-strong); }
.t-group { padding: 10px; border-radius: 16px; background: var(--bg-1); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; height: 100%; }
.tg-name { font-size: 12.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.tg-name .chip { margin-left: auto; height: 18px; font-size: 10px; padding: 0 6px; }
.t-group .t-node { width: 100%; padding: 6px 8px; gap: 8px; border-radius: 11px; }
.t-group .t-node.ghost { justify-content: center; color: var(--text-3); font-size: 12px; background: transparent; border-style: dashed; min-height: 42px; }
.t-members { display: flex; flex-direction: column; gap: 4px; }
.t-chip { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px 4px; border-radius: 10px; font-size: 12px; border: 1px solid transparent; transition: opacity var(--dur-2), background var(--dur-2), border-color var(--dur-2); width: 100%; text-align: left; }
.t-chip:hover { background: var(--bg-3); }
.t-chip .sc { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
.tree.probing [data-seat] { opacity: .32; }
.tree.probing [data-seat].reach { opacity: 1; background: var(--tint-ok); border-color: var(--edge-ok); }
.tree.probing [data-seat].self { opacity: 1; background: var(--accent-soft); border-color: var(--edge-accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 12px; color: var(--text-3); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.matrix-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); }
table.matrix { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 720px; }
.matrix th, .matrix td { padding: 10px 12px; text-align: center; white-space: nowrap; }
.matrix thead th { position: sticky; top: 0; background: var(--bg-3); font-size: 11.5px; color: var(--text-2); font-weight: 650; }
.matrix tbody tr + tr td { box-shadow: inset 0 1px 0 var(--line); }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.matrix td:first-child b { display: block; font-weight: 650; }
.matrix td:first-child code { font-size: 11px; color: var(--text-3); }
.yes { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--tint-ok); color: var(--ok); border: 1px solid var(--edge-ok); }
.yes .ic { width: 12px; height: 12px; }
.no { color: var(--text-3); }
.cond { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--tint-warn); color: var(--warn); border: 1px solid var(--edge-warn); }

.hosts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.host {
  padding: 12px; border-radius: 14px; background: var(--bg-1); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 6px;
  transition: border-color var(--dur-2), box-shadow var(--dur-2), transform var(--dur-1);
}
.host:hover { border-color: var(--line-strong); }
.host.sel { border-color: var(--edge-accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.host .h-top { display: flex; align-items: center; gap: 8px; }
.host .h-logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 750; font-size: 11px; color: #fff; flex: none; }
.host b { font-size: 13.5px; }
.host small { font-size: 11px; color: var(--text-3); display: block; line-height: 1.3; }
.host .h-st { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.host .h-st i { width: 7px; height: 7px; border-radius: 50%; }
.host .h-st.bound { color: var(--ok); } .host .h-st.bound i { background: var(--ok); }
.host .h-st.mapping, .host .h-st.scanning { color: var(--warn); } .host .h-st.mapping i, .host .h-st.scanning i { background: var(--warn); animation: blink 1s infinite; }
.host .h-st.pending { color: var(--text-3); } .host .h-st.pending i { border: 1.5px solid var(--text-3); }
@keyframes blink { 50% { opacity: .3; } }
.host .h-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.slots { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.slot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg-3); border: 1px solid var(--line); font-size: 12px; min-width: 0; }
.slot code { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot code:first-child { color: var(--text-3); }
.slot .arrow { color: var(--text-3); flex: none; }

/* ---------- Inspector ---------- */
.insp-col { min-width: 0; overflow: hidden; }
.inspector {
  width: var(--insp-w); height: calc(100% - 16px); margin: 8px 8px 8px 0; display: flex; flex-direction: column;
  background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-md); overflow: hidden;
  transition: opacity var(--dur-3), transform var(--dur-4) var(--ease-out);
}
.app:not(.insp-open) .inspector { opacity: 0; transform: translateX(16px); }
.in-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 16px; box-shadow: 0 1px 0 var(--line); }
.in-head .ttl { line-height: 1.25; }
.in-head .ttl b { display: block; font-size: 13.5px; font-weight: 650; }
.in-head .icon-btn { margin-left: auto; }
.in-switch { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; box-shadow: 0 1px 0 var(--line); }
.in-switch button { border-radius: 50%; padding: 2px; border: 1px solid transparent; transition: border-color var(--dur-1), transform var(--dur-1); }
.in-switch button:hover { transform: translateY(-1px); }
.in-switch button.on { border-color: var(--accent); }
.in-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px; }

  function bindOrgHover() {

  function reachableOf(sid) {
    var s = SEATS[sid];
    if (!s) return [];
    if (s.scope === "company_all") return Object.keys(SEATS).filter(function (k) { return k !== sid; });
    if (s.scope === "report_to_secretary_only") return ["chief-secretary"];
    var peers = [];
    GROUPS.forEach(function (x) {
      if (x.members.indexOf(sid) !== -1) {
        x.members.forEach(function (m) {
          if (m !== sid && peers.indexOf(m) === -1) peers.push(m);
        });
      }
    });
    return peers.length ? peers : ["chief-secretary"];
  }

      if (el.hasAttribute("disabled")) return;
      SEATS[S.insp].scope = el.getAttribute("data-scope"); renderAll();
    } else if (act === "json-preview") {
      var j = JSON.stringify(buildCompanyJson(), null, 2);
      openModal('<div class="mo-head"><h3>company.json 实时预览</h3><button class="icon-btn" data-act="modal-close">×</button></div><div class="mo-body"><pre class="field" style="white-space:pre-wrap">' + esc(j) + '</pre></div><div class="mo-foot"><button class="btn" data-act="modal-close">关闭</button><button class="btn primary" data-act="json-export">导出文件</button></div>');
    } else if (act === "json-import") {
      openModal('<div class="mo-head"><h3>导入并合并 company.json</h3><button class="icon-btn" data-act="modal-close">×</button></div><div class="mo-body"><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn sm" data-act="import-sample">填入示例外部团队包 (含文案策划席位)</button></div><textarea id="importBox" class="field" placeholder="粘贴 company.json 内容…"></textarea></div><div class="mo-foot"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="import-run">校验并合并团队</button></div>');
    } else if (act === "import-sample") {
      var sample = {
        $schema: "https://agentsxco.com/schemas/company.v1.json",
        companyName: "Agents x Company · Imported Studio",
        employees: [
          { seatId: "copywriter", displayName: "文案策划", department: "导入员工", persona: "负责产品着陆页微文案与多语言语气校准。", defaultModel: "anthropic/claude-opus-5-5", fallbackModels: ["openai/gpt-6.1-sol"], dispatchScope: "peer_assist" }
        ]
      };
      var ib = $("#importBox"); if (ib) ib.value = JSON.stringify(sample, null, 2);
    } else if (act === "import-run") {
      try {
        var raw = ($("#importBox") || {}).value || "{}";
        applyCompany(JSON.parse(raw));
        closeModal();
      } catch (e) { toast("JSON 解析失败：" + e.message, "danger"); }
    } else if (act === "json-export") {
      var blob = new Blob([JSON.stringify(buildCompanyJson(), null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "company.json";
      document.body.appendChild(a); a.click(); a.remove();
      toast("已导出 company.json");
    } else if (act === "probe") {
      HOSTS.forEach(function (h) { h.status = "probing"; });
      renderOrgView();
      setTimeout(function () {
        HOSTS.forEach(function (h) { h.status = "bound"; });
        if (S.room === "org") renderOrgView();
        toast("5 大宿主环境探测完成，模型槽位已全部绑定");
      }, 600);
    } else if (act === "send") {
      sendMessage();
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    var act = el.getAttribute("data-act");
    if (act === "model") {
      SEATS[S.insp].model = el.value; renderAll();
    } else if (act === "fb-add" && el.value) {
      var s = SEATS[S.insp];
      if (s.fallbacks.indexOf(el.value) === -1) s.fallbacks.push(el.value);
      el.value = ""; renderInspector();
    } else if (act === "persona") {
      SEATS[S.insp].persona = el.value;
    }
  });

  $("#search").addEventListener("input", function (ev) {
    S.search = ev.target.value; renderSidebar();
  });
  $("#input").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229) { ev.preventDefault(); sendMessage(); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeModal();
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("#search").focus(); }
  });

  setInterval(function () {
    if (document.hidden) return;
    Object.keys(SEATS).forEach(function (k) {
      var d = (Math.random() - 0.48) * 0.18;
      SEATS[k].kvHit = Math.max(89.5, Math.min(96.8, SEATS[k].kvHit + d));
    });
    var kvEl = $("#kvVal");
    if (kvEl && SEATS[S.insp]) kvEl.textContent = SEATS[S.insp].kvHit.toFixed(1) + "%";
  }, 2800);

  document.querySelector('[data-act="attach"]').innerHTML = IC.clip;
  document.querySelector('[data-act="voice"]').innerHTML = IC.mic;
  $("#sendBtn").innerHTML = IC.send;
  setTheme(S.theme);
  if (location.hash === "#b") S.room = "group:design-prototype";
  else if (location.hash === "#c") S.room = "org";
  renderAll();
})();
</script>
</body>
</html>
